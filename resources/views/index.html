<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommonsEventUploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <!-- Navigation -->
        <nav class="bg-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <h1 class="text-xl font-bold text-gray-800">CommonsEventUploader</h1>
                    </div>
                    <div class="flex items-center">
                        <div id="auth-section"></div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <div id="app">
                <!-- Welcome Section -->
                <div class="bg-white overflow-hidden shadow-sm sm:rounded-lg p-6">
                    <h2 class="text-2xl font-semibold text-gray-900 mb-4">Welcome to CommonsEventUploader</h2>
                    <p class="text-gray-700 mb-4">
                        A web application for uploading conference-related images to Wikimedia Commons.
                    </p>
                    <div class="mt-6">
                        <button onclick="login()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                            Login with Wikimedia
                        </button>
                    </div>
                </div>

                <!-- Events Section (shown after login) -->
                <div id="events-section" class="hidden mt-6">
                    <div class="bg-white overflow-hidden shadow-sm sm:rounded-lg p-6">
                        <h2 class="text-2xl font-semibold text-gray-900 mb-4">Events</h2>
                        <div id="events-list"></div>
                    </div>
                </div>

                <!-- Dashboard Section (shown after login) -->
                <div id="dashboard-section" class="hidden mt-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white overflow-hidden shadow-sm sm:rounded-lg p-6">
                            <h3 class="text-lg font-semibold text-gray-900 mb-2">My Uploads</h3>
                            <p class="text-3xl font-bold text-blue-600" id="my-uploads-count">0</p>
                        </div>
                        <div class="bg-white overflow-hidden shadow-sm sm:rounded-lg p-6">
                            <h3 class="text-lg font-semibold text-gray-900 mb-2">Successful Uploads</h3>
                            <p class="text-3xl font-bold text-green-600" id="successful-uploads-count">0</p>
                        </div>
                        <div class="bg-white overflow-hidden shadow-sm sm:rounded-lg p-6">
                            <h3 class="text-lg font-semibold text-gray-900 mb-2">Events Participated</h3>
                            <p class="text-3xl font-bold text-purple-600" id="events-participated-count">0</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentUser = null;

        // Check if user is logged in
        async function checkAuth() {
            try {
                const response = await fetch('/auth/me');
                if (response.ok) {
                    currentUser = await response.json();
                    showDashboard();
                } else {
                    showLogin();
                }
            } catch (error) {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('auth-section').innerHTML = `
                <button onclick="login()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Login
                </button>
            `;
        }

        function showDashboard() {
            document.getElementById('auth-section').innerHTML = `
                <div class="flex items-center space-x-4">
                    <span class="text-gray-700">Welcome, ${currentUser.username}!</span>
                    <span class="text-sm text-gray-500">(${currentUser.role})</span>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                        Logout
                    </button>
                </div>
            `;
            document.getElementById('events-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            loadEvents();
            loadStats();
        }

        function login() {
            window.location.href = '/auth/login';
        }

        async function logout() {
            await fetch('/auth/logout', { method: 'POST' });
            window.location.reload();
        }

        async function loadEvents() {
            try {
                const response = await fetch('/events');
                if (response.ok) {
                    const events = await response.json();
                    displayEvents(events);
                }
            } catch (error) {
                console.error('Failed to load events:', error);
            }
        }

        function displayEvents(events) {
            const container = document.getElementById('events-list');
            if (events.length === 0) {
                container.innerHTML = '<p class="text-gray-500">No events available.</p>';
                return;
            }

            container.innerHTML = events.map(event => `
                <div class="border-b border-gray-200 py-4">
                    <h3 class="text-lg font-semibold text-gray-900">${event.title}</h3>
                    <p class="text-gray-600">${event.description || 'No description'}</p>
                    <p class="text-sm text-gray-500 mt-2">
                        ${event.start_date} to ${event.end_date}
                    </p>
                </div>
            `).join('');
        }

        async function loadStats() {
            try {
                const response = await fetch('/stats/user');
                if (response.ok) {
                    const stats = await response.json();
                    document.getElementById('my-uploads-count').textContent = stats.total_uploads || 0;
                    document.getElementById('successful-uploads-count').textContent = stats.successful_uploads || 0;
                    document.getElementById('events-participated-count').textContent = stats.events_participated || 0;
                }
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Initialize on page load
        checkAuth();
    </script>
</body>
</html>
